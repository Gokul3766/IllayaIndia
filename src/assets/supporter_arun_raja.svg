<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500' width='100%' height='100%'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#e5dad0'/>
      <stop offset='100%' stop-color='#bfae9e'/>
    </linearGradient>
    <linearGradient id='skinGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#b87d55'/>
      <stop offset='100%' stop-color='#8f5833'/>
    </linearGradient>
    <linearGradient id='suitGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1b263b'/>
      <stop offset='100%' stop-color='#0d1b2a'/>
    </linearGradient>
    <linearGradient id='tieGrad' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#9013fe'/>
      <stop offset='100%' stop-color='#5a0099'/>
    </linearGradient>
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
      <feDropShadow dx='0' dy='8' stdDeviation='6' flood-color='#000000' flood-opacity='0.25'/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width='400' height='500' fill='url(#bgGrad)'/>

  <!-- Shoulders & Suit -->
  <path d='M 50 500 C 50 340, 100 290, 200 290 C 300 290, 350 340, 350 500 Z' fill='url(#suitGrad)' filter='url(#shadow)'/>

  <!-- White Shirt V-Neck -->
  <polygon points='165,290 235,290 200,390' fill='#ffffff'/>

  <!-- Red/Purple Tie -->
  <polygon points='193,310 207,310 212,460 200,480 188,460' fill='url(#tieGrad)'/>
  <polygon points='190,298 210,298 205,312 195,312' fill='#7000cc'/>

  <!-- Suit Lapels -->
  <polygon points='90,320 165,290 150,420 105,500' fill='#141e2e'/>
  <polygon points='310,320 235,290 250,420 295,500' fill='#141e2e'/>

  <!-- Neck -->
  <rect x='170' y='210' width='60' height='90' rx='10' fill='#9e643d'/>

  <!-- Head Base -->
  <path d='M 130 160 C 130 70, 270 70, 270 160 C 270 235, 230 255, 200 255 C 170 255, 130 235, 130 160 Z' fill='url(#skinGrad)' filter='url(#shadow)'/>

  <!-- Hair -->
  <path d='M 125 150 C 120 70, 160 50, 200 50 C 240 50, 280 70, 275 150 C 265 95, 240 70, 200 70 C 160 70, 135 95, 125 150 Z' fill='#121010'/>

  <!-- Ears -->
  <circle cx='128' cy='165' r='14' fill='#a36942'/>
  <circle cx='272' cy='165' r='14' fill='#a36942'/>

  <!-- Eyebrows -->
  <path d='M 150 135 Q 170 128 185 136' stroke='#121010' stroke-width='4.5' stroke-linecap='round' fill='none'/>
  <path d='M 215 136 Q 230 128 250 135' stroke='#121010' stroke-width='4.5' stroke-linecap='round' fill='none'/>

  <!-- Eyes -->
  <ellipse cx='167' cy='148' rx='9' ry='6' fill='#ffffff'/>
  <circle cx='167' cy='148' r='4.5' fill='#231815'/>
  <circle cx='168.5' cy='146.5' r='1.5' fill='#ffffff'/>

  <ellipse cx='233' cy='148' rx='9' ry='6' fill='#ffffff'/>
  <circle cx='233' cy='148' r='4.5' fill='#231815'/>
  <circle cx='234.5' cy='146.5' r='1.5' fill='#ffffff'/>

  <!-- Nose -->
  <path d='M 200 148 L 195 180 L 205 180' stroke='#784523' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/>

  <!-- Mustache -->
  <path d='M 170 198 Q 200 190 230 198 Q 200 206 170 198 Z' fill='#1a1412'/>

  <!-- Smile -->
  <path d='M 175 210 Q 200 228 225 210' stroke='#ffffff' stroke-width='5' stroke-linecap='round' fill='none'/>
  <path d='M 172 208 Q 200 232 228 208' stroke='#5e2e14' stroke-width='2.5' fill='none'/>
</svg>